<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Grid Layout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

	<!-- Row 1 -->
	<div class="row">
	  <div class="col-sm col-md-4">Row 1 Col 1</div>
	  <div class="col-sm col-md-8">Row 1 Col 2</div>
	</div>

    <!-- Row 2 -->
    <div class="row justify-content-md-between">
      <div class="col-md-4 offset-md-2">Row 2 Col 1</div>
      <div class="col-md-4">Row 2 Col 2</div>
    </div>

    <!-- Row 3 -->
    <div class="row justify-content-center">
      <div class="col-sm col-md-4">Row 3 Col 1</div>
      <div class="col-sm col-md-4">Row 3 Col 2</div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
